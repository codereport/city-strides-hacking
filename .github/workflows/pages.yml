name: Deploy upcoming runs to Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - past_runs.html
      - run_manager.js
      - upcoming_runs/**
      - past_runs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # This repository contains gigabytes of route-planning data, while the
      # published site contains only the run indexes and route-map folders. A
      # partial, sparse clone avoids checking out the data and private submodule.
      - name: Fetch only the public site
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REVISION: ${{ github.sha }}
        run: |
          git clone --no-checkout --depth 1 --filter=blob:none "$REPOSITORY_URL" source
          git -C source sparse-checkout init --no-cone
          git -C source sparse-checkout set /index.html /past_runs.html /run_manager.js /upcoming_runs/ /past_runs/
          git -C source checkout --detach "$REVISION"

          mkdir _site
          cp source/index.html _site/
          cp source/past_runs.html source/run_manager.js _site/
          cp -R source/upcoming_runs _site/
          cp -R source/past_runs _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # A cancelled deployment for this revision remained active in the Pages
      # backend and blocks all newer revisions. Remove this step after it clears.
      - name: Cancel stale Pages deployment
        continue-on-error: true
        env:
          API_URL: ${{ github.api_url }}
          STALE_DEPLOYMENT_ID: 39ee27b7f91f51b12db0946aeb20b0d603fee880
          TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL/repos/$GITHUB_REPOSITORY/pages/deployments/$STALE_DEPLOYMENT_ID/cancel"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
